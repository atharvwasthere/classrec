name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Without ffmpeg the pipeline tests skip themselves; install it so they run.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Vet
        run: go vet ./...
      - name: Vet the Windows build
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...
          GOOS=windows GOARCH=amd64 golangci-lint run ./...
      - name: Test
        run: go test ./...

      - name: Embedded manifest matches classrec.manifest
        if: runner.os == 'Linux'
        run: |
          go run ./tools/winres cmd/classrec/classrec.manifest "$RUNNER_TEMP/rsrc.syso"
          cmp "$RUNNER_TEMP/rsrc.syso" cmd/classrec/rsrc_windows_amd64.syso

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build classrec.exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o classrec.exe ./cmd/classrec
      - name: Checksum
        run: sha256sum classrec.exe > classrec.exe.sha256
      # The release notes are this version's section of CHANGELOG.md; a tag without one does not ship.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v heading="## [$GITHUB_REF_NAME]" 'index($0, heading) == 1 {found=1; next} found && /^(## )?\[/ {exit} found {print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" classrec.exe classrec.exe.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md
